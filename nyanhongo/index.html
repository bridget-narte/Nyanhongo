<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NekoNihongo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand"><span id="brandMascot"></span><span class="brand-name" id="brandName">NekoNihongo</span></div>
      <nav id="nav"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="sidebar">☰</button>
      <header class="topbar" id="topbar"></header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>

  <dialog id="dialog">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div class="dlg-actions">
      <button class="btn ghost" id="dlgCancel">Cancel</button>
      <button class="btn danger" id="dlgOk">Confirm</button>
    </div>
  </dialog>

  <input type="file" id="importFile" accept="application/json" hidden>
  <div id="toasts" role="status"></div>

  <!-- Load order matters. Rename these files freely, just update the names here. -->
  <script src="js/storage.js"></script>
  <script src="js/gamification.js"></script>
  <script src="js/quiz-engine.js"></script>
  <script src="js/grammar-data.js"></script>
  <script src="js/particle-data.js"></script>
  <script src="js/conjugation.js"></script>
  <script src="js/verb-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/grammar.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/verbs.js"></script>
</body>
</html>
